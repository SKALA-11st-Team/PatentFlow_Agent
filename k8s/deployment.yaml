apiVersion: apps/v1
kind: Deployment
metadata:
  name: team11-patentflow-agent-deployment
  namespace: patentflow
  labels:
    app: team11-patentflow-agent
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # INFRA-12: 공유 클러스터에 서지 파드(추가 1개)를 띄울 CPU/메모리 여유가 없어 롤아웃이
  # Pending으로 멈추는 문제 — 서지 없이 기존 파드를 먼저 내리고 그 자원으로 새 파드를 띄운다.
  # 단일 레플리카라 교체 중 짧은 중단이 있지만 내부 비동기 평가 서비스라 허용 가능.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: team11-patentflow-agent
  template:
    metadata:
      labels:
        app: team11-patentflow-agent
    spec:
      # SEC-09: 컨테이너를 비특권(non-root)으로 실행한다(Dockerfile USER appuser=uid 10001과 일치).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: harbor-regcred
      containers:
        - name: team11-patentflow-agent
          image: harbor.example.com/patentflow/team11-patentflow-agent:placeholder
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: team11-patentflow-agent-config
            - secretRef:
                name: team11-patentflow-agent-secret
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # INFRA-12: 공유 클러스터가 requests 기준으로 과약정되어 500m/1Gi 요청이 스케줄되지
            # 못함(실사용은 노드당 CPU 3~11% 수준). 평시 부하가 낮은 비동기 평가 서비스라 요청량을
            # 낮추고, 평가 피크는 limits(2 CPU/2Gi)로 흡수한다.
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
