openapi: 3.0.3
info:
  title: KIPRISPlus Patent Evaluation Source API
  version: 1.0.0
  description: 'KIPRISPlus만 사용하는 특허 평가 데이터 수집용 OpenAPI 명세입니다.


    평가 기준(권리성, 기술성, 시장성, 라이프사이클 경제성, 사업 연계성) 중 KIPRISPlus에서 수집 가능한 항목을 중심으로 구성했습니다.

    추후 WIPO, World Bank, 뉴스/공시, 내부문서 등 다른 데이터 소스를 붙일 수 있도록 x-evaluation-usage, x-future-extension,
    EvaluationDataSnapshot 스키마를 포함합니다.


    주의: 일부 검색/서지 API 경로는 프로젝트 내부 wrapper 기준으로 정리한 논리 경로입니다. KIPRISPlus 실제 운영 경로는 통합설명서의
    Request URL에 맞춰 adapter 계층에서 매핑하세요. 공개전문PDF API는 사용자가 제공한 실제 오퍼레이션 getPubFullTextInfoSearch를 반영했고,
    권리성 분석용으로 공고전문PDF 우선 선택 wrapper를 추가했습니다.'
servers:
- url: http://plus.kipris.or.kr
  description: KIPRISPlus base URL / 또는 내부 wrapper base URL
security:
- kiprisServiceKey: []
tags:
- name: Patent Search
  description: 특허 후보 검색 및 유사/중복 특허 탐색
- name: Patent Detail
  description: 출원번호 기반 서지·청구항·법적상태 상세 조회
- name: Applicant Search
  description: 출원인/등록권자 기반 경쟁사 활동 탐색
- name: Classification Search
  description: IPC/CPC 기반 기술군 탐색
- name: Admin History
  description: 행정처리 변동 이력 조회
- name: Overseas Citation
  description: 해외특허 인용 문헌 조회
- name: Patent Documents
  description: 특허·실용 도면/전문 PDF 및 이미지 경로 조회
- name: Evaluation Data Model
  description: KIPRIS 수집 결과를 평가 엔진에 넘기기 위한 확장 가능 데이터 모델
paths:
  /kipris/patent-utility/search/advanced:
    get:
      tags:
      - Patent Search
      operationId: getAdvancedSearch
      summary: 특허·실용 전체검색
      description: '평가 대상 특허 후보를 검색하거나, 발명의 명칭/초록/청구범위/IPC/출원인 등을 조합해 유사·중복 특허 후보를
        찾습니다.

        원천 오퍼레이션: 특허·실용 공개·등록공보 / 항목별검색 / 전체검색 - getAdvancedSearch

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: word
        in: query
        schema:
          type: string
        description: 자유검색
      - name: inventionTitle
        in: query
        schema:
          type: string
        description: 발명의 명칭
      - name: astrtCont
        in: query
        schema:
          type: string
        description: 초록
      - name: claimScope
        in: query
        schema:
          type: string
        description: 청구범위
      - name: ipcNumber
        in: query
        schema:
          type: string
        description: IPC 코드
      - name: applicationNumber
        in: query
        schema:
          type: string
        description: 출원번호
      - name: applicant
        in: query
        schema:
          type: string
        description: 출원인명 또는 특허고객번호
      - name: rightHoler
        in: query
        schema:
          type: string
        description: 등록권자
      - name: patent
        in: query
        schema:
          type: boolean
          default: true
        description: 특허 포함 여부
      - name: utility
        in: query
        schema:
          type: boolean
          default: false
        description: 실용신안 포함 여부
      - name: lastvalue
        in: query
        schema:
          type: string
          enum:
          - ''
          - A
          - C
          - F
          - G
          - I
          - J
          - R
        description: '행정처분: 전체 공백, 공개 A, 취하 C, 소멸 F, 포기 G, 무효 I, 거절 J, 등록 R'
      - name: pageNo
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 페이지번호
      - name: numOfRows
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 30
        description: 페이지당 건수
      - name: sortSpec
        in: query
        schema:
          type: string
          enum:
          - PD
          - AD
          - GD
          - OPD
          - FD
          - FOD
          - RD
        description: '정렬기준: PD 공고일자, AD 출원일자, GD 등록일자, OPD 공개일자, FD 국제출원일자, FOD 국제공개일자,
          RD 우선권주장일자'
      - name: descSort
        in: query
        schema:
          type: boolean
          default: true
        description: desc 정렬 여부
      responses:
        '200':
          description: 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentSearchResponse'
      x-evaluation-usage:
        권리성:
        - 중복 여부
        기술성:
        - 기술완성도 후보 판단용 텍스트
        시장성:
        - 경쟁사 활동
        - 산업/기술군 특허 건수
  /kipris/patent-utility/search/application-number:
    get:
      tags:
      - Patent Search
      operationId: applicationNumberSearchInfo
      summary: 출원번호 검색
      description: '출원번호로 기본 서지 정보를 조회합니다. 상세 평가는 보통 이 결과의 applicationNumber를 상세 API에
        넘겨 수행합니다.

        원천 오퍼레이션: 특허·실용 공개·등록공보 / 항목별검색 / 출원번호 검색 - applicationNumberSearchInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: applicationNumber
        in: query
        required: true
        schema:
          type: string
        description: 출원번호
      - $ref: '#/components/parameters/Patent'
      - $ref: '#/components/parameters/Utility'
      - $ref: '#/components/parameters/DocsStart'
      - $ref: '#/components/parameters/DocsCount'
      responses:
        '200':
          description: 출원번호 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentSearchResponse'
  /kipris/patent-utility/detail/bibliography:
    get:
      tags:
      - Patent Detail
      operationId: getBibliographyDetailInfoSearch
      summary: 서지상세정보 조회
      description: '출원번호 하나를 기준으로 상세 서지, 청구항, IPC, 패밀리, 우선권, 출원인, 발명자, 법적상태, 이미지 경로
        등을 조회합니다.

        원천 오퍼레이션: 특허·실용 공개·등록공보 / 서지정보 / 서지상세정보(공공데이터 포털 연계) - getBibliographyDetailInfoSearch

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: applicationNumber
        in: query
        required: true
        schema:
          type: string
        description: 출원번호
      responses:
        '200':
          description: 서지상세정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BibliographyDetailResponse'
      x-evaluation-usage:
        권리성:
        - 청구항 개수
        - 청구항 질
        - 법적 안정성
        기술성:
        - IPC
        - 초록
        - 청구항
        - 기술완성도 판단용 텍스트
        시장성:
        - 패밀리 규모
        - 지정국가
        - 출원인 국가
        라이프사이클 경제성:
        - 출원일자
        - 등록일자
        - 등록상태
        - 법적상태
  /kipris/patent-utility/detail/family:
    get:
      tags:
      - Patent Detail
      operationId: getAppNoPatFamInfoSearch
      summary: 패밀리 특허 정보 조회
      description: '출원번호 하나를 기준으로 패밀리 특허 정보를 조회합니다. workflow에서는 패밀리 코드의 국가코드와
        등록번호를 우선 사용합니다.

        원천 오퍼레이션: 특허 패밀리 / 특허패밀리정보조회(국내출원번호) - getAppNoPatFamInfoSearch

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: applicationNumber
        in: query
        required: true
        schema:
          type: string
        description: 출원번호
      responses:
        '200':
          description: 패밀리 특허 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyPatentRegistrationResponse'
      x-evaluation-usage:
        시장성:
        - 해외 패밀리 보유 국가
        - 패밀리 등록번호 기반 해외 권리화 범위 확인
  /kipris/patent-utility/search/ipc:
    get:
      tags:
      - Classification Search
      operationId: ipcSearchInfo
      summary: IPC 코드 기반 검색
      description: '동일 기술군의 특허 수, 경쟁사 출원 활동, 유사 특허 후보를 탐색합니다.

        원천 오퍼레이션: 특허·실용 공개·등록공보 / 항목별검색 / IPC - ipcSearchInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: ipcNumber
        in: query
        required: true
        schema:
          type: string
        description: IPC 코드
      - $ref: '#/components/parameters/Patent'
      - $ref: '#/components/parameters/Utility'
      - $ref: '#/components/parameters/DocsStart'
      - $ref: '#/components/parameters/DocsCount'
      - $ref: '#/components/parameters/SortSpec'
      - $ref: '#/components/parameters/DescSort'
      responses:
        '200':
          description: IPC 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentSearchResponse'
      x-evaluation-usage:
        시장성:
        - 시장/기술군 범위
        - 경쟁사 활동
        권리성:
        - 중복 여부 후보군
  /kipris/patent-utility/search/cpc:
    get:
      tags:
      - Classification Search
      operationId: cpcSearchInfo
      summary: CPC 코드 기반 검색
      description: 'CPC 코드로 동일·인접 기술군 특허를 탐색합니다.

        원천 오퍼레이션: 특허·실용 공개·등록공보 / 항목별검색 / CPC 검색 - cpcSearchInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: cpcNumber
        in: query
        required: true
        schema:
          type: string
        description: CPC 코드
      - $ref: '#/components/parameters/Patent'
      - $ref: '#/components/parameters/Utility'
      - $ref: '#/components/parameters/DocsStart'
      - $ref: '#/components/parameters/DocsCount'
      - $ref: '#/components/parameters/SortSpec'
      - $ref: '#/components/parameters/DescSort'
      responses:
        '200':
          description: CPC 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentSearchResponse'
      x-evaluation-usage:
        시장성:
        - 시장/기술군 범위
        - 경쟁사 활동
        권리성:
        - 중복 여부 후보군
  /kipris/patent-utility/search/applicant:
    get:
      tags:
      - Applicant Search
      operationId: applicantNameSearchInfo
      summary: 출원인 기반 검색
      description: '경쟁사명 또는 특정 출원인명으로 특허 활동을 조회합니다.

        원천 오퍼레이션: 특허·실용 공개·등록공보 / 항목별검색 / 출원인정보 - applicantNameSearchInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: applicant
        in: query
        required: true
        schema:
          type: string
        description: 출원인정보
      - $ref: '#/components/parameters/Patent'
      - $ref: '#/components/parameters/Utility'
      - $ref: '#/components/parameters/DocsStart'
      - $ref: '#/components/parameters/DocsCount'
      - $ref: '#/components/parameters/SortSpec'
      - $ref: '#/components/parameters/DescSort'
      responses:
        '200':
          description: 출원인 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentSearchResponse'
      x-evaluation-usage:
        시장성:
        - 경쟁사 활동 여부
  /kipris/patent-utility/search/right-holder:
    get:
      tags:
      - Applicant Search
      operationId: rightHolerSearchInfo
      summary: 등록권자 기반 검색
      description: '현재 권리 보유자 기준으로 특허를 조회합니다.

        원천 오퍼레이션: 특허·실용 공개·등록공보 / 항목별검색 / 등록권자정보 - rightHolerSearchInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: rightHoler
        in: query
        required: true
        schema:
          type: string
        description: 등록권자명
      - $ref: '#/components/parameters/Patent'
      - $ref: '#/components/parameters/Utility'
      - $ref: '#/components/parameters/DocsStart'
      - $ref: '#/components/parameters/DocsCount'
      - $ref: '#/components/parameters/SortSpec'
      - $ref: '#/components/parameters/DescSort'
      responses:
        '200':
          description: 등록권자 검색 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatentSearchResponse'
      x-evaluation-usage:
        시장성:
        - 경쟁사 활동 여부
        라이프사이클 경제성:
        - 권리 유지 상태 후보 확인
  /kipris/patent-utility/admin-history/transfers:
    get:
      tags:
      - Admin History
      operationId: transferListInfo
      summary: 특허·실용 행정처리 변동정보 조회
      description: '특정 변동일자에 발생한 특허·실용 행정처리 이력을 조회합니다.

        원천 오퍼레이션: 특허·실용 행정처리 이력 / 변동정보 - transferListInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - name: kind
        in: query
        required: true
        schema:
          type: string
          enum:
          - oper1
        description: 검색코드. oper1은 통합이력정보(특실)
      - name: searchRight
        in: query
        required: true
        schema:
          type: string
          enum:
          - all
          - p
          - u
        description: 권리. all 전체, p 특허, u 실용신안
      - name: transferDate
        in: query
        required: true
        schema:
          type: string
          pattern: ^\\d{8}$
          example: '20260427'
        description: 변동일자 YYYYMMDD
      responses:
        '200':
          description: 변동정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferListResponse'
      x-evaluation-usage:
        권리성:
        - 리스크 요소
        - 법적 안정성
        라이프사이클 경제성:
        - 등록/소멸/포기 등 상태 변화 모니터링
  /kipris/overseas-patent/bibliography/claims:
    get:
      tags:
      - Overseas Citation
      operationId: demandParagraphInfo
      summary: 해외특허 청구항 조회
      description: '해외특허 문헌번호와 국가코드 기준으로 청구항을 조회합니다.

        원천 오퍼레이션: 해외특허 / 서지정보 / 청구항 - demandParagraphInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - $ref: '#/components/parameters/LiteratureNumber'
      - $ref: '#/components/parameters/CountryCode'
      responses:
        '200':
          description: 해외특허 청구항
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverseasClaimsResponse'
      x-evaluation-usage:
        권리성:
        - 해외 패밀리 청구항 질 비교
  /kipris/overseas-patent/citations/domestic-documents:
    get:
      tags:
      - Overseas Citation
      operationId: usPatentDocumentsInfo
      summary: 해외특허 인용 자국 문헌 조회
      description: '해외특허의 인용 문헌 중 자국 문헌을 조회합니다. 전방 인용 수 자체가 아니라 인용 네트워크 분석의 보조 데이터로
        사용합니다.

        원천 오퍼레이션: 해외특허 / 서지정보 / 인용(자국 문헌) - usPatentDocumentsInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - $ref: '#/components/parameters/LiteratureNumber'
      - $ref: '#/components/parameters/CountryCode'
      responses:
        '200':
          description: 인용 자국 문헌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationDocumentsResponse'
      x-evaluation-usage:
        기술성:
        - 인용 기반 기술 영향력 보조
  /kipris/overseas-patent/citations/foreign-documents:
    get:
      tags:
      - Overseas Citation
      operationId: foreignPatentDocumentsInfo
      summary: 해외특허 인용 타국 문헌 조회
      description: '해외특허의 인용 문헌 중 타국 문헌을 조회합니다.

        원천 오퍼레이션: 해외특허 / 서지정보 / 인용(타국 문헌) - foreignPatentDocumentsInfo

        '
      parameters:
      - $ref: '#/components/parameters/ServiceKey'
      - $ref: '#/components/parameters/LiteratureNumber'
      - $ref: '#/components/parameters/CountryCode'
      responses:
        '200':
          description: 인용 타국 문헌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CitationDocumentsResponse'
      x-evaluation-usage:
        기술성:
        - 인용 기반 기술 영향력 보조
  /kipris/patent-utility/documents/publication-fulltext-pdf:
    get:
      tags:
      - Patent Documents
      operationId: getPatentPublicationFullTextPdfPath
      summary: 공개전문PDF 경로 조회
