components:
  securitySchemes:
    kiprisServiceKey:
      type: apiKey
      in: query
      name: ServiceKey
      description: KIPRISPlus 서비스키
  parameters:
    ServiceKey:
      name: ServiceKey
      in: query
      required: true
      schema:
        type: string
      description: KIPRISPlus 서비스키
    Patent:
      name: patent
      in: query
      schema:
        type: boolean
        default: true
      description: 특허 포함 여부
    Utility:
      name: utility
      in: query
      schema:
        type: boolean
        default: false
      description: 실용신안 포함 여부
    DocsStart:
      name: docsStart
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 페이지번호
    DocsCount:
      name: docsCount
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 30
      description: 페이지당 건수
    SortSpec:
      name: sortSpec
      in: query
      schema:
        type: string
        enum:
        - PD
        - AD
        - GD
        - OPD
        - FD
        - FOD
        - RD
      description: 정렬기준
    DescSort:
      name: descSort
      in: query
      schema:
        type: boolean
        default: true
      description: desc 정렬 여부
    LiteratureNumber:
      name: literatureNumber
      in: query
      required: true
      schema:
        type: string
      description: 해외특허 문헌번호
    CountryCode:
      name: countryCode
      in: query
      required: true
      schema:
        type: string
        enum:
        - US
        - EP
        - WO
        - JP
        - PJ
        - CP
        - CN
        - TW
        - RU
        - CO
        - SE
        - ES
        - IL
        - IN
        - VN
      description: 국가코드. 다중 선택 불가
  schemas:
    PatentSearchResponse:
      type: object
      properties:
        totalSearchCount:
          type: integer
          description: 전체건수
        pageNo:
          type: integer
          description: 페이지번호
        numOfRows:
          type: integer
          description: 페이지당 건수
        items:
