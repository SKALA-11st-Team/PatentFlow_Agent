        body:
          type: object
          properties:
            item:
              $ref: '#/components/schemas/PdfPathItem'
    PreferredFullTextPdfResponse:
      type: object
      description: 권리성 분석에 사용할 전문PDF를 공고전문 우선, 공개전문 fallback 규칙으로 선택한 내부 wrapper 응답
      properties:
        applicationNumber:
          type: string
          description: 출원번호
          example: '1020050050026'
        selectedType:
          type: string
          enum:
          - ANNOUNCEMENT_FULLTEXT_PDF
          - PUBLICATION_FULLTEXT_PDF
          description: 선택된 전문PDF 유형
        reason:
          type: string
          description: 해당 PDF 유형을 선택한 이유
        docName:
          type: string
          description: 파일명
          example: 1020050050026.pdf
        path:
          type: string
          format: uri
          description: PDF 파일 다운로드 경로
          example: http://plus.kipris.or.kr/kiprisplusws/fileToss.jsp?arg=...
      required:
      - applicationNumber
      - selectedType
      - docName
      - path
    KiprisResponseHeader:
      type: object
      properties:
        requestMsgID:
          type: string
          description: 요청 메시지 ID
        responseTime:
          type: string
          description: 응답 시간
          example: '2014-10-31 10:26:17.2617'
        responseMsgID:
          type: string
          description: 응답 메시지 ID
        successYN:
          type: string
          description: 성공 여부
        resultCode:
          type: string
          description: 결과 코드
          example: '00'
        resultMsg:
          type: string
          description: 결과 메시지
          example: NORMAL SERVICE.
    PdfPathItem:
      type: object
      properties:
        docName:
          type: string
          description: 파일명
          example: 1020050050026.pdf
        path:
          type: string
          format: uri
          description: PDF 파일 다운로드 경로. 이 URL을 GET 요청하면 PDF를 받을 수 있음.
          example: http://plus.kipris.or.kr/kiprisplusws/fileToss.jsp?arg=...
      required:
      - docName
      - path
    EvaluationDataSnapshot:
      type: object
      description: 특허 평가 엔진에 넘기는 통합 데이터 스냅샷. 현재는 KIPRIS 데이터만 사용하지만 externalData 필드로
        다른 API 결과를 확장 가능하게 설계합니다.
      properties:
        applicationNumber:
          type: string
          description: 출원번호
        source:
          type: string
          enum:
          - KIPRISPlus
          default: KIPRISPlus
        kipris:
          $ref: '#/components/schemas/KiprisPatentEvaluationData'
        externalData:
          type: object
          description: 추후 WIPO, WorldBank, 뉴스/공시, 내부문서 등 외부 데이터 확장 영역
          additionalProperties: true
          example:
            wipo: {}
            worldBank: {}
            news: {}
            internalBusinessData: {}
        evaluationAxes:
          type: array
          items:
            $ref: '#/components/schemas/EvaluationAxisData'
    KiprisPatentEvaluationData:
      type: object
      description: KIPRISPlus로 수집 가능한 평가 데이터 묶음
      properties:
        searchResult:
          $ref: '#/components/schemas/PatentSearchItem'
        bibliographyDetail:
          $ref: '#/components/schemas/BibliographyDetailResponse'
        familyPatents:
          type: array
          items:
            $ref: '#/components/schemas/FamilyPatentInfo'
        publicFullTextPdf:
          $ref: '#/components/schemas/PdfPathItem'
        announcementFullTextPdf:
          $ref: '#/components/schemas/PdfPathItem'
        preferredFullTextPdf:
          $ref: '#/components/schemas/PreferredFullTextPdfResponse'
        adminHistory:
          $ref: '#/components/schemas/TransferListResponse'
        citationDocuments:
          $ref: '#/components/schemas/CitationDocumentsResponse'
    EvaluationAxisData:
      type: object
      properties:
        axis:
          type: string
          enum:
          - 권리성
          - 기술성
          - 시장성
          - 라이프사이클 경제성
          - 사업 연계성
          - 최종 종합 지표
        availableFromKipris:
          type: boolean
        kiprisFields:
          type: array
          items:
            type: string
        requiresExternalData:
          type: boolean
        futureSources:
          type: array
          items:
            type: string
          example:
          - WIPO
          - WorldBank
          - News
          - InternalDocuments
x-evaluation-design:
  currentScope: KIPRISPlus only
  primaryKey: applicationNumber
  kiprisSupportedAxes:
    권리성:
    - claimCount
    - claimInfoArray.claim
    - registerStatus
    - legalStatusInfoArray
    - priorArtDocumentsInfoArray
    - publicFullTextPdf.path
    기술성:
    - ipcInfoArray
    - abstractInfoArray
    - claimInfoArray
    - priorArtDocumentsInfoArray
    - citationDocuments
    - publicFullTextPdf.path
    시장성:
    - familyInfoArray
    - designatedStateInfoArray
    - applicantInfoArray.country
    - applicantNameSearchInfo
    - ipcSearchInfo
    - cpcSearchInfo
    라이프사이클 경제성:
    - applicationDate
    - registerDate
    - registerStatus
    - finalDisposal
    - legalStatusInfoArray
    사업 연계성:
    - KIPRIS만으로는 부족. 내부 제품/서비스/로드맵 데이터 필요
  futureExtensionPolicy: 새 API 소스는 paths에 /{source}/...로 추가하고, EvaluationDataSnapshot.externalData에
    결과를 연결한다.
