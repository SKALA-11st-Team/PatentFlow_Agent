          description: 공고번호
        publicDate:
          type: string
          description: 공고일자
        registrationNumber:
          type: string
          description: 등록번호
        registrationDate:
          type: string
          description: 등록일자
        registrationStatus:
          type: string
          description: 등록상태
        ipcNumber:
          type: string
          description: IPC코드
        inventionName:
          type: string
          description: 발명의 명칭
        abstract:
          type: string
          description: 초록
        applicant:
          type: string
          description: 출원인
        drawingPath:
          type: string
          description: 큰 이미지 경로
        thumbnailPath:
          type: string
          description: 이미지 경로
