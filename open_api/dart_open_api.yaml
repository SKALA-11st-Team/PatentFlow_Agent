openapi: 3.0.3
info:
  title: Patent Management DART Proxy API
  version: 1.0.0
  description: |
    특허 가치평가를 위한 DART Proxy API
    - 기업 기본정보
    - 재무 정보
    - 사업보고서 검색
    - 공시 원문 조회

servers:
  - url: http://127.0.0.1:8000

paths:
  /dart/company:
    get:
      summary: 기업개황 조회
      description: 기업 기본 정보 조회
      parameters:
        - name: corp_code
          in: query
          required: true
          schema:
            type: string
            example: "00126380"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object

  /dart/financial-account:
    get:
      summary: 주요 재무계정 조회
      description: 사업보고서 기준 주요 재무 데이터 조회
      parameters:
        - name: corp_code
          in: query
          required: true
          schema:
            type: string
            example: "00126380"
        - name: bsns_year
          in: query
          required: true
          schema:
            type: string
            example: "2023"
      responses:
        "200":
          description: 성공
          content:
            application/json:
              schema:
                type: object

  /dart/disclosure:
    get:
      summary: 사업보고서 검색
      description: |
        특정 기업의 사업보고서/반기보고서/분기보고서를 조회합니다.
        OpenDART의 정기공시(pblntf_ty=A)만 검색합니다.
      parameters:
        - name: corp_code
          in: query
          required: true
          schema:
            type: string
            example: "00126380"

        - name: bgn_de
          in: query
          required: true
          description: 시작일 (YYYYMMDD)
          schema:
            type: string
            example: "20240301"

        - name: end_de
          in: query
          required: true
          description: 종료일 (YYYYMMDD)
          schema:
            type: string
            example: "20240331"

        - name: pblntf_ty
          in: query
          required: false
          description: 공시유형. A는 정기공시
          schema:
            type: string
            enum: ["A"]
            default: "A"

        - name: page_count
          in: query
          required: false
          description: 페이지당 건수
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 100

      responses:
        "200":
          description: 사업보고서 목록
          content:
            application/json:
              schema:
                type: object

  /dart/document:
    get:
      summary: 공시 원문 조회
      description: |
        사업보고서 원문 다운로드 (ZIP binary)
        ※ Swagger에서는 다운로드만 가능
      parameters:
        - name: rcept_no
          in: query
          required: true
          description: 접수번호 14자리
          schema:
            type: string
            example: "20240318001234"
      responses:
        "200":
          description: ZIP 파일
          content:
            application/zip:
              schema:
                type: string
                format: binary