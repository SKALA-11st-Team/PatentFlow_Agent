name: Deploy Agent to EKS

# BE(deploy-eks.yml)와 동일한 Harbor → EKS 파이프라인. 에이전트는 클러스터 내부 ClusterIP라
# ingress/postgres 단계가 없고, BE가 http://team11-patentflow-agent-svc:8000 으로 호출한다.
on:
  push:
    branches:
      - Seeun
  workflow_dispatch:

env:
  IMAGE_NAME: team11-patentflow-agent
  KUBE_NAMESPACE: ${{ vars.KUBE_NAMESPACE || 'patentflow' }}
  # 공유 PostgreSQL(StatefulSet) 접속 — BE와 동일 인스턴스. 비밀번호만 시크릿으로 주입한다.
  PGVECTOR_HOST: ${{ vars.PGVECTOR_HOST || 'team11-patentflow-postgres-svc' }}
  PGVECTOR_DB: ${{ vars.PGVECTOR_DB || 'patentflow' }}
  PGVECTOR_USER: ${{ vars.PGVECTOR_USER || 'patentflow' }}
  OPENAI_CHAT_MODEL: ${{ vars.OPENAI_CHAT_MODEL || 'gpt-5-mini' }}
  ENABLE_SHARED_DB_FALLBACK: ${{ vars.ENABLE_SHARED_DB_FALLBACK || 'true' }}
  UNIFIED_API_BASE_URL: ${{ vars.UNIFIED_API_BASE_URL || 'http://team11-patentflow-be-svc:80' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'ap-northeast-2' }}
  AWS_PROFILE_NAME: ${{ vars.AWS_PROFILE_NAME || 'skala-student' }}

jobs:
  deploy:
    name: Build, push, and rollout
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        env:
          HARBOR_REGISTRY_VALUE: ${{ secrets.HARBOR_REGISTRY }}
          HARBOR_PROJECT_VALUE: ${{ secrets.HARBOR_PROJECT }}
          HARBOR_USERNAME_VALUE: ${{ secrets.HARBOR_USERNAME }}
          HARBOR_PASSWORD_VALUE: ${{ secrets.HARBOR_PASSWORD }}
          KUBE_CONFIG_VALUE: ${{ secrets.KUBE_CONFIG }}
          AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
          POSTGRES_PASSWORD_VALUE: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          missing=0
          for name in \
            HARBOR_REGISTRY_VALUE \
            HARBOR_PROJECT_VALUE \
            HARBOR_USERNAME_VALUE \
            HARBOR_PASSWORD_VALUE \
            KUBE_CONFIG_VALUE \
            AWS_ACCESS_KEY_ID_VALUE \
            AWS_SECRET_ACCESS_KEY_VALUE \
            OPENAI_API_KEY_VALUE \
            POSTGRES_PASSWORD_VALUE
          do
            if [ -z "${!name}" ]; then
              echo "Missing required secret: ${name%_VALUE}" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Set image coordinates
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_REF=${{ secrets.HARBOR_REGISTRY }}/${{ secrets.HARBOR_PROJECT }}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_REF }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure AWS profile for kubeconfig exec auth
        env:
          AWS_ACCESS_KEY_ID_VALUE: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY_VALUE: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN_VALUE: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID_VALUE}" ] || [ -z "${AWS_SECRET_ACCESS_KEY_VALUE}" ]; then
            echo "AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY secrets are required because KUBE_CONFIG uses aws eks get-token." >&2
            exit 1
          fi
          mkdir -p "$HOME/.aws"
          {
            echo "[${AWS_PROFILE_NAME}]"
            echo "aws_access_key_id=${AWS_ACCESS_KEY_ID_VALUE}"
            echo "aws_secret_access_key=${AWS_SECRET_ACCESS_KEY_VALUE}"
            if [ -n "${AWS_SESSION_TOKEN_VALUE}" ]; then
              echo "aws_session_token=${AWS_SESSION_TOKEN_VALUE}"
            fi
          } > "$HOME/.aws/credentials"
          {
            echo "[profile ${AWS_PROFILE_NAME}]"
            echo "region=${AWS_REGION}"
            echo "output=json"
          } > "$HOME/.aws/config"

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl version --client=true
          kubectl config current-context

      - name: Check cluster prerequisites
        run: |
          kubectl get namespace "${KUBE_NAMESPACE}" >/dev/null 2>&1 || kubectl auth can-i create namespaces
          kubectl auth can-i create deployments.apps --namespace="${KUBE_NAMESPACE}"
          kubectl auth can-i create services --namespace="${KUBE_NAMESPACE}"
          kubectl auth can-i create secrets --namespace="${KUBE_NAMESPACE}"
          kubectl auth can-i create configmaps --namespace="${KUBE_NAMESPACE}"

      - name: Prepare manifests
        run: |
          cp -R k8s /tmp/agent-k8s
          sed -i "s/namespace: patentflow/namespace: ${KUBE_NAMESPACE}/g" /tmp/agent-k8s/*.yaml
          sed -i "s|harbor.example.com/patentflow/team11-patentflow-agent:placeholder|${IMAGE_REF}|g" /tmp/agent-k8s/deployment.yaml

      - name: Apply Harbor image pull secret
        run: |
          kubectl create secret docker-registry harbor-regcred \
            --docker-server="${{ secrets.HARBOR_REGISTRY }}" \
            --docker-username="${{ secrets.HARBOR_USERNAME }}" \
            --docker-password="${{ secrets.HARBOR_PASSWORD }}" \
            --namespace="${KUBE_NAMESPACE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply agent secret
        env:
          OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
          # 단일 키(KIPRIS_SERVICE_KEY) 또는 한도 분산용 다중 키(KIPRIS_SERVICE_KEYS, 콤마 구분) 중
          # 가진 것을 넣으면 된다. 에이전트 KiprisClient는 KEYS를 우선 읽고 라운드로빈/실패 시 재시도한다.
          KIPRIS_SERVICE_KEY_VALUE: ${{ secrets.KIPRIS_SERVICE_KEY }}
          KIPRIS_SERVICE_KEYS_VALUE: ${{ secrets.KIPRIS_SERVICE_KEYS }}
          OPENAI_SUPERVISOR_MODEL_VALUE: ${{ secrets.OPENAI_SUPERVISOR_MODEL }}
          LANGSMITH_API_KEY_VALUE: ${{ secrets.LANGSMITH_API_KEY }}
          POSTGRES_PASSWORD_VALUE: ${{ secrets.POSTGRES_PASSWORD }}
          # 평가(evaluate) 근거수집용 외부 API. 분류(recommend-fields)는 사용 안 함.
          # 미제공 시 빈 값으로 들어가고 해당 근거만 degrade(부팅엔 지장 없음).
          DART_KEY_VALUE: ${{ secrets.DART_KEY }}
          GNEWS_API_KEY_VALUE: ${{ secrets.GNEWS_API_KEY }}
          NAVER_CLIENT_ID_VALUE: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET_VALUE: ${{ secrets.NAVER_CLIENT_SECRET }}
          GOOGLE_CUSTOM_SEARCH_API_KEY_VALUE: ${{ secrets.GOOGLE_CUSTOM_SEARCH_API_KEY }}
          GOOGLE_CUSTOM_SEARCH_CX_VALUE: ${{ secrets.GOOGLE_CUSTOM_SEARCH_CX }}
          TAVILY_API_KEY_VALUE: ${{ secrets.TAVILY_API_KEY }}
        run: |
          PGVECTOR_DATABASE_URL="postgresql://${PGVECTOR_USER}:${POSTGRES_PASSWORD_VALUE}@${PGVECTOR_HOST}:5432/${PGVECTOR_DB}"
          kubectl create secret generic team11-patentflow-agent-secret \
            --namespace="${KUBE_NAMESPACE}" \
            --from-literal=OPENAI_API_KEY="${OPENAI_API_KEY_VALUE}" \
            --from-literal=KIPRIS_SERVICE_KEY="${KIPRIS_SERVICE_KEY_VALUE}" \
            --from-literal=KIPRIS_SERVICE_KEYS="${KIPRIS_SERVICE_KEYS_VALUE}" \
            --from-literal=OPENAI_SUPERVISOR_MODEL="${OPENAI_SUPERVISOR_MODEL_VALUE}" \
            --from-literal=LANGSMITH_API_KEY="${LANGSMITH_API_KEY_VALUE}" \
            --from-literal=PGVECTOR_DATABASE_URL="${PGVECTOR_DATABASE_URL}" \
            --from-literal=DART_KEY="${DART_KEY_VALUE}" \
            --from-literal=GNEWS_API_KEY="${GNEWS_API_KEY_VALUE}" \
            --from-literal=NAVER_CLIENT_ID="${NAVER_CLIENT_ID_VALUE}" \
            --from-literal=NAVER_CLIENT_SECRET="${NAVER_CLIENT_SECRET_VALUE}" \
            --from-literal=GOOGLE_CUSTOM_SEARCH_API_KEY="${GOOGLE_CUSTOM_SEARCH_API_KEY_VALUE}" \
            --from-literal=GOOGLE_CUSTOM_SEARCH_CX="${GOOGLE_CUSTOM_SEARCH_CX_VALUE}" \
            --from-literal=TAVILY_API_KEY="${TAVILY_API_KEY_VALUE}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply agent config
        run: |
          kubectl create configmap team11-patentflow-agent-config \
            --namespace="${KUBE_NAMESPACE}" \
            --from-literal=OPENAI_CHAT_MODEL="${OPENAI_CHAT_MODEL}" \
            --from-literal=ENABLE_SHARED_DB_FALLBACK="${ENABLE_SHARED_DB_FALLBACK}" \
            --from-literal=UNIFIED_API_BASE_URL="${UNIFIED_API_BASE_URL}" \
            --from-literal=PGVECTOR_TABLE_NAME="industry_report_chunks" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f /tmp/agent-k8s/deployment.yaml
          kubectl apply -f /tmp/agent-k8s/service.yaml

      - name: Rollout status
        id: agent_rollout
        run: kubectl rollout status deployment/team11-patentflow-agent-deployment --namespace="${KUBE_NAMESPACE}" --timeout=300s

      - name: Diagnose rollout failure
        if: ${{ failure() && steps.agent_rollout.outcome == 'failure' }}
        run: |
          kubectl get deployment,replicaset,svc,pod --namespace="${KUBE_NAMESPACE}" -o wide
          kubectl describe deployment/team11-patentflow-agent-deployment --namespace="${KUBE_NAMESPACE}" || true
          kubectl describe pod --namespace="${KUBE_NAMESPACE}" -l app=team11-patentflow-agent || true
          kubectl logs --namespace="${KUBE_NAMESPACE}" -l app=team11-patentflow-agent --all-containers --tail=300 || true
