name: CI

# INFRA-02: PR 품질 게이트. deploy-eks.yml의 test 잡은 push:main/dispatch에서만 돌아 PR 단계 회귀를
# 차단하지 못했다. 본 워크플로는 pull_request에서 pytest를 실행해 머지 전에 회귀를 잡는다.
on:
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest
